<!DOCTYPE html>
<html>
<head>
    <title>Success</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(to right, #141e30, #243b55);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .success-card{
            background: white;
            padding: 40px;
            width: 420px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.3);
        }

        .check-icon{
            font-size: 70px;
            color: #0d6efd;
        }

        h1{
            margin-top: 15px;
            font-weight: bold;
            color: #333;
            font-size: 24px;
        }

        p{
            color: gray;
            margin-top: 10px;
        }

        .btn-home{
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #0d6efd;
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
        }

        .btn-home:hover{
            background: #0b5ed7;
        }
    </style>
</head>

<body>

<div class="success-card">

    <div class="check-icon">
        ✔
    </div>

    <h1>Registration Successful!</h1>

    <p>
        Thank you for registering for the event.
    </p>

    <a href="/" class="btn-home">
        Back to Registration
    </a>

</div>

</body>
</html>
