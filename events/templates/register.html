<!DOCTYPE html>
<html>
<head>
    <title>Event Registration</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(to right, #141e30, #243b55);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-card{
            background: white;
            padding: 35px;
            width: 420px;
            border-radius: 15px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.3);
        }

        h2{
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
        }

        input{
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            margin-top: 5px;
        }

        .form-group{
            margin-bottom: 18px;
        }

        button{
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #0d6efd;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover{
            background: #0b5ed7;
        }

        .errorlist{
            color: red;
            list-style: none;
            padding: 0;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="register-card">

    <h2>Event Registration</h2>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">
            <label>Full Name</label>
            {{ form.full_name }}
        </div>

        <div class="form-group">
            <label>Email</label>
            {{ form.email }}
        </div>

        <div class="form-group">
            <label>Age</label>
            {{ form.age }}
        </div>

        <div class="form-group">
            <label>Password</label>
            {{ form.password }}
        </div>

        <button type="submit">
            Register
        </button>

    </form>

</div>

</body>
</html>
